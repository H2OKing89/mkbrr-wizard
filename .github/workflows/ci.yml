name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check src tests mkbrr-wizard.py

      - name: Check formatting
        run: python -m black --check src tests mkbrr-wizard.py

      - name: Run Mypy
        run: python -m mypy src tests

  package:
    name: Build and install package
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          smoke_dir="$(mktemp -d)"
          config_path="$smoke_dir/config.yaml"
          schema_path="$smoke_dir/batch.json"
          (
            cd "$smoke_dir"
            python -c "import mkbrr_wizard"
            mkbrr-wizard --help
            python -m mkbrr_wizard --help
            mkbrr-wizard --config "$config_path" init-config
            python -m mkbrr_wizard schema "$schema_path"
          )
          cmp config.yaml.sample "$config_path"
          cmp schema/batch.json "$schema_path"
