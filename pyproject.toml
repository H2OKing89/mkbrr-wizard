[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "mkbrr-wizard.py"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project]
name = "mkbrr-wizard"
version = "0.1.0"
description = "Interactive CLI wizard for mkbrr with Rich UI support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.7,<3",
    "rich>=14.2.0",
    "httpx[http2]>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
mkbrr-wizard = "mkbrr_wizard.cli:main"

[project.optional-dependencies]
ui = [
    "prompt_toolkit>=3.0.40",
]

dev = [
    "pytest>=7.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "build>=1.2",
    "prompt_toolkit>=3.0.40",
    "black>=23.5.0",
    "ruff>=0.14.0,<0.19.0",
    "isort>=5.12.0",
    "mypy>=0.942",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mkbrr_wizard = ["schema/*.json"]

[tool.setuptools.data-files]
"share/mkbrr-wizard" = ["config.yaml.sample"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
